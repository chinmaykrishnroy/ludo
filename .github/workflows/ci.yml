name: Validate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=high
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: matrix.os == 'ubuntu-latest'
        with:
          name: ludo-validated-${{ github.sha }}
          path: |
            dist/
            build/
            package.json
            package-lock.json
            LICENSE
          retention-days: 14
          overwrite: true
  container:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t ludo-test:${{ github.sha }} .
      - name: Verify container startup and restart
        run: |
          docker run -d --name ludo-ci --stop-timeout 30 -e BACKUP_INTERVAL_MS=60000 -p 127.0.0.1:3011:3000 ludo-test:${{ github.sha }}
          for attempt in $(seq 1 40); do
            if curl --fail http://127.0.0.1:3011/readyz; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:3011/readyz
          docker restart ludo-ci
          for attempt in $(seq 1 40); do
            if curl --fail http://127.0.0.1:3011/readyz; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:3011/readyz
          docker logs ludo-ci
      - if: always()
        run: docker logs ludo-ci; docker rm -f ludo-ci
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:browser
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: failure()
        with:
          name: browser-failures-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
