apiVersion: apps/v1
kind: Deployment
metadata:
  name: ludo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ludo
  template:
    metadata:
      labels:
        app: ludo
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ludo
          image: ghcr.io/chinmaykrishnroy/ludo:v0.1.5
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - secretRef:
                name: ludo-server
          env:
            - name: NODE_ENV
              value: production
            - name: HOST
              value: 0.0.0.0
            - name: PORT
              value: "3000"
            - name: DB_PATH
              value: /data/ludo.sqlite
            - name: BACKUP_DIR
              value: /data/backups
            - name: BOT_DIFFICULTY
              value: "10"
            - name: MAX_DATABASE_BYTES
              value: "268435456"
            - name: MAX_VOICE_BYTES
              value: "67108864"
          volumeMounts:
            - name: data
              mountPath: /data
            - name: temporary
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1500m
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ludo-data
        - name: temporary
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
